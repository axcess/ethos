[package]
name = "tank-sim"
version = "0.1.0"
edition = "2021"
description = "The Tank: deterministic headless simulation engine"

[[bin]]
name = "tank"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
toml = "0.8"
libm = "0.2"
libc = "0.2"
